# ============================================================
# email_monitor.yml — Module 4: Gmail monitor (every 2 hours)
# Safe to run on GitHub Actions — uses only Gmail API (no browser)
# ============================================================

name: Email Monitor & Tracker Update

on:
  schedule:
    # Every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  email-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Google Credentials
        run: |
          mkdir -p ~/.config/ashvani-job-bot
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > ~/.config/ashvani-job-bot/credentials.json
          chmod 600 ~/.config/ashvani-job-bot/credentials.json

          # Restore OAuth token from cache
          echo '${{ secrets.GOOGLE_TOKEN_JSON }}' > ~/.config/ashvani-job-bot/token.json 2>/dev/null || true
          chmod 600 ~/.config/ashvani-job-bot/token.json 2>/dev/null || true

      - name: Restore SQLite database
        uses: actions/cache@v4
        with:
          path: ~/.config/ashvani-job-bot/job_tracker.db
          key: job-tracker-db-${{ github.run_id }}
          restore-keys: |
            job-tracker-db-

      - name: Initialize database
        env:
          DB_PATH: ~/.config/ashvani-job-bot/job_tracker.db
          DB_ENCRYPTION_KEY: ${{ secrets.DB_ENCRYPTION_KEY }}
        run: python -c "from shared.database import init_db; init_db()"

      - name: Run email monitor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEETS_ID: ${{ secrets.SHEETS_ID }}
          CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          DB_PATH: ~/.config/ashvani-job-bot/job_tracker.db
          DB_ENCRYPTION_KEY: ${{ secrets.DB_ENCRYPTION_KEY }}
          LOG_LEVEL: INFO
        run: |
          mkdir -p logs
          python scripts/run_pipeline.py --module email 2>&1 | tee logs/email_monitor.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email-monitor-logs-${{ github.run_id }}
          path: logs/
          retention-days: 7

      - name: Save SQLite database
        uses: actions/cache@v4
        with:
          path: ~/.config/ashvani-job-bot/job_tracker.db
          key: job-tracker-db-${{ github.run_id }}

# ============================================================
# security_scan.yml — Automated security scanning
# Runs on push, PR, and weekly on Monday
# ============================================================

name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday at 6 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install security tools
        run: |
          pip install bandit safety detect-secrets

      - name: Run Bandit SAST scan
        run: |
          bandit -r modules/ shared/ scripts/ \
            -f json -o bandit-report.json \
            -ll \
            --exclude "tests/"
          echo "Bandit scan complete"
        continue-on-error: true

      - name: Run Safety dependency CVE scan
        run: |
          safety check -r requirements.txt \
            --json > safety-report.json
          safety check -r requirements.txt
        continue-on-error: true

      - name: Run detect-secrets scan
        run: |
          detect-secrets scan . \
            --exclude-files ".git/.*" \
            --exclude-files ".venv/.*" \
            --exclude-files "resumes/.*" \
            --exclude-files "logs/.*" > detected-secrets.json
          echo "Secret scan complete"
        continue-on-error: true

      - name: Check for hardcoded secrets
        run: |
          # Fail if any real secrets found (not in baseline)
          python3 -c "
          import json, sys
          with open('detected-secrets.json') as f:
              data = json.load(f)
          results = data.get('results', {})
          if results:
              print(f'SECURITY WARNING: Potential secrets found in {len(results)} files')
              for filename, secrets in results.items():
                  print(f'  {filename}: {len(secrets)} potential secret(s)')
              sys.exit(1)
          else:
              print('No secrets detected in source code')
          "

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.run_id }}
          path: |
            bandit-report.json
            safety-report.json
            detected-secrets.json
          retention-days: 30

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
        continue-on-error: true
